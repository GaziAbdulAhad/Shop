<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#100B14">
<title>হোম | আমার দোকান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<section class="hero"><div class="wrap">
<h1>নতুন কালেকশন</h1>
<p class="sub">আপনার পছন্দের পণ্য এখন এক জায়গায়</p>
<div class="search"><input id="q" type="search" placeholder="প্রোডাক্ট খুঁজুন..." aria-label="প্রোডাক্ট খুঁজুন"></div>
</div></section>
<main class="wrap" id="products">
<div id="rows"></div>
<div class="chips" id="chips"></div>
<h2 class="sec">সব প্রোডাক্ট</h2>
<div id="tagbar"></div>
<section class="grid" id="list"></section>
<h2 class="sec" style="text-align:center">কেন আমাদের কাছ থেকে কিনবেন?</h2>
<div class="trust-strip" id="trust"></div>
</main>
<script src="js/app.js"></script><script src="js/shop.js"></script><script src="js/extras.js"></script>
<script>
const list=document.getElementById("list"),q=document.getElementById("q"),chips=document.getElementById("chips");let cat="",tag="";
document.getElementById("trust").innerHTML=TRUST.map(t=>`<div><span>${t[0]}</span>${t[1]}</div>`).join("");
const TAGN={new:"নতুন পণ্য",trending:"Trending",offer:"সেল / অফার"},tb=document.getElementById("tagbar"),rows=document.getElementById("rows");
const go=()=>{tb.innerHTML=tag?`<div class="tagbar">ফিল্টার: <b>${TAGN[tag]}</b> <button class="chip" id="tagx" type="button">✕ সরান</button></div>`:"";return renderList(list,false,q.value.trim(),cat,tag)};
(async()=>{await renderList(list,false);
  const cs=[...new Set((_c||[]).map(p=>p.category).filter(Boolean))];
  if(cs.length)chips.innerHTML=["",...cs].map(c=>`<button class="chip${c?"":" on"}" data-c="${esc(c)}">${c?esc(c):"সব"}</button>`).join("");buildRows()})();
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;tag="";chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));go()});
const ROWS=[["new","🆕 নতুন পণ্য"],["trending","🔥 Trending"],["offer","🏷️ সেল / অফার"]];
function buildRows(){const all=_c||[];
  rows.innerHTML=ROWS.map(([k,t])=>{const l=all.filter(p=>inRow(p,k));if(!l.length)return"";
    return `<section class="hrow-s"><div class="hrow-h"><h2 class="sec">${t}</h2><button class="more-l" type="button" data-tag="${k}">সব দেখুন →</button></div><div class="hrow">${l.slice(0,10).map(p=>cardHTML(p,false)).join("")}</div></section>`}).join("")}
rows.addEventListener("click",e=>{const b=e.target.closest("[data-tag]");if(!b)return;tag=b.dataset.tag;cat="";
  chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.c===""));go();list.scrollIntoView({behavior:"smooth",block:"start"})});
tb.addEventListener("click",e=>{if(e.target.closest("#tagx")){tag="";go()}});
q.addEventListener("input",go);
</script></body></html>
