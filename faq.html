    <h1 data-i18n="nav_faq">প্রশ্নোত্তর</h1>
    <p class="text-muted"><span data-i18n="faq_intro">সবচেয়ে বেশি জিজ্ঞাসা করা প্রশ্নের উত্তর।</span> <a class="bn" href="https://wa.me/8801755855600" style="color:var(--purple);font-weight:700" target="_blank" rel="noopener" data-i18n="faq_ask_wa">WhatsApp-এ সরাসরি জিজ্ঞেস করুন →</a></p>

<script>
'use strict';
const CFG = window.MEHER_CONFIG;
const FAQ = [
  { bn: ['অগ্রিম কিছু দিতে হবে?', 'না — সব অর্ডার ক্যাশ অন ডেলিভারি। পণ্য হাতে পেয়ে মূল্য পরিশোধ করবেন।'],
    en: ['Do I need to pay anything upfront?', 'No — every order is Cash on Delivery. You pay when the parcel reaches you.'] },
  { bn: ['ডেলিভারি চার্জ কত?', `ঢাকার ভেতরে ৳${CFG.shipping.insideDhaka} ও বাইরে ৳${CFG.shipping.outsideDhaka}। কার্ট ও চেকআউটে অর্ডার কনফার্ম করার আগেই চার্জ দেখতে পাবেন।`],
    en: ['What are the delivery charges?', `Inside Dhaka ৳${CFG.shipping.insideDhaka}, outside Dhaka ৳${CFG.shipping.outsideDhaka}. You see the charge before confirming in cart & checkout.`] },
  { bn: ['ডেলিভারি কতদিনে পাব?', 'ঢাকায় ১–২ কর্মদিবস, ঢাকার বাইরে ২–৪ কর্মদিবস। কুরিয়ারের পিক-আপের পর ট্র্যাক পেজে অবস্থা দেখা যাবে।'],
    en: ['How long does delivery take?', 'Inside Dhaka 1–2 working days, outside 2–4 working days. Track your order anytime with your order ID.'] },
  { bn: ['অর্ডার কিভাবে কনফার্ম হয়?', 'ওয়েবসাইট থেকে অর্ডার দিলেই আমরা আপনার মোবাইলে কল করে অর্ডারটি যাচাই ও কনফার্ম করি — তারপর কুরিয়ারে পাঠানো হয়।'],
    en: ['How is my order confirmed?', 'We call you on the number you gave — once confirmed, the parcel goes out by courier.'] },
  { bn: ['পণ্য পছন্দ না হলে কী করব?', 'পণ্য ডেলিভারির সময় ডেলিভারি ম্যানের সামনে দেখে পছন্দ না হলে সেই মুহূর্তেই ফেরত দিতে পারবেন (ডেলিভারি চার্জ গ্রাহক বহন করবেন)। পছন্দের কারণে মূল্য রিফান্ড হয় না — বিস্তারিত: রিটার্ন পলিসি।'],
    en: ["What if I don't like the product?", 'Check it in front of the delivery person — if you do not like it, return it on the spot (you pay the delivery charge). Preference changes are not refunded — see Return Policy.'] },
  { bn: ['ভুল বা ক্ষতিগ্রস্ত পণ্য পেলে?', 'পণ্য পাওয়ার ৭ দিনের মধ্যে WhatsApp-এ (ছবি/ভিডিওসহ) জানাতে হবে। প্যাকেট খোলার Unboxing Video রাখলে যাচাই সহজ হয়। আমাদের ভুল প্রমাণিত হলে পণ্য পরিবর্তন বা পূর্ণ রিফান্ড পাবেন।'],
    en: ['What if the product is wrong or damaged?', 'Report within 7 days via WhatsApp with photo/video (an unboxing video helps). If the fault is ours, you get a replacement or full refund.'] },
  { bn: ['এক্সচেঞ্জ সুবিধা আছে?', 'হ্যাঁ — পণ্য ফেরত দেওয়ার ৭ দিনের মধ্যে এক্সচেঞ্জ করা যায় (স্টক সাপেক্ষে)। বিস্তারিত: রিটার্ন ও এক্সচেঞ্জ পলিসি।'],
    en: ['Is exchange possible?', 'Yes — exchange within 7 days of returning the item (subject to stock). See Returns & Exchange Policy.'] },
  { bn: ['রিভিউ কিভাবে দেব?', 'অর্ডার ডেলিভারির পর রিভিউ লিখুন পেজে যান — অর্ডার নম্বর ও মোবাইল নম্বর দিয়ে যাচাই করে রিভিউ দিতে পারবেন। রিভিউ যাচাইয়ের পর প্রকাশ হয়।'],
    en: ['How do I leave a review?', 'Go to “Write a Review” — verify with your order ID + phone, submit, and it goes live after verification.'] },
  { bn: ['আমার তথ্য কারা দেখতে পারে?', 'আপনার নাম, নম্বর ও ঠিকানা শুধু অর্ডার ডেলিভারির জন্যই ব্যবহার হয়। অন্য কাউকে বিক্রি বা শেয়ার করা হয় না — যেমন আমরা পলিসিতে প্রতিশ্রুতি দিয়েছি।'],
    en: ['Who can see my data?', 'Name, number and address are used only to confirm & deliver your order — never sold or shared, as promised in our Privacy Policy.'] }
];

const list = document.getElementById('faqList');
function renderFAQ() {
  const en = MEHER.getLang() === 'en';
  list.innerHTML = FAQ.map((f, i) => {
    const [q, a] = en ? f.en : f.bn;
    return `
    <div class="faq-item">
      <button class="faq-q" aria-expanded="false" aria-controls="faq-a-${i}"><span>${q}</span><svg class="faq-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="faq-a" id="faq-a-${i}" role="region"><p>${a}</p></div>
    </div>`;
  }).join('');
}
list.addEventListener('click', e => {
  const btn = e.target.closest('.faq-q'); if (!btn) return;
  const item = btn.closest('.faq-item');
  item.classList.toggle('open');
  btn.setAttribute('aria-expanded', item.classList.contains('open'));
});
renderFAQ();
window.addEventListener('meher:lang-changed', renderFAQ);
</script>
</body>
