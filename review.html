<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রিভিউ লিখুন — ARIFAH (আরিফাহ)</title>
<meta name="description" content="ডেলিভারি পাওয়া অর্ডারের রিভিউ দিন — ভেরিফাইড ক্রয়ের রিভিউ যাচাইয়ের পর প্রকাশ করা হয়।">
<meta name="robots" content="noindex"><meta name="theme-color" content="#352344">
<link rel="icon" type="image/svg+xml" href="assets/img/placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main"><span data-i18n="skip_to_content">Skip to content</span></a>
<div id="site-header"></div>

<main id="main" class="container" style="max-width:640px;padding:var(--sp-6) 0 var(--sp-7)">
  <span class="eyebrow" data-i18n="rv_eyebrow">আপনার অভিজ্ঞতা</span>
  <h1 style="font-family:var(--font-display);color:var(--purple);font-size:var(--fs-2xl);margin:.25rem 0 .4rem" data-i18n="rv_h1">রিভিউ লিখুন</h1>
  <p class="text-muted" data-i18n="rv_p">ডেলিভারি পাওয়া অর্ডারের রিভিউ দেওয়া যাবে। রিভিউ যাচাইয়ের পর ওয়েবসাইটে প্রকাশ করা হয়।</p>

  <form class="card card-pad" id="reviewForm" novalidate style="margin-top:1rem">
    <div class="field"><label for="rvOrder"><span data-i18n="rv_order_l">অর্ডার নম্বর</span> <span class="req">*</span></label><input class="input" id="rvOrder" required placeholder="ORD-…" autocomplete="off"></div>
    <div class="field"><label for="rvPhone"><span data-i18n="rv_phone_l">অর্ডারের মোবাইল নম্বর</span> <span class="req">*</span></label><input class="input" id="rvPhone" type="tel" inputmode="numeric" required maxlength="11" placeholder="01XXXXXXXXX" autocomplete="tel-national"></div>

    <fieldset class="field"><legend class="field" style="margin:0 0 .35rem"><span data-i18n="rv_rating_l">রেটিং</span> <span class="req">*</span></legend>
      <div id="starInput" role="radiogroup" aria-label="স্টার রেটিং" style="display:flex;gap:.3rem;font-size:2rem">
        <button type="button" data-n="1" role="radio" aria-checked="false" aria-label="1 star" style="color:#D8CFDD">★</button>
        <button type="button" data-n="2" role="radio" aria-checked="false" aria-label="2 stars" style="color:#D8CFDD">★</button>
        <button type="button" data-n="3" role="radio" aria-checked="false" aria-label="3 stars" style="color:#D8CFDD">★</button>
        <button type="button" data-n="4" role="radio" aria-checked="false" aria-label="4 stars" style="color:#D8CFDD">★</button>
        <button type="button" data-n="5" role="radio" aria-checked="false" aria-label="5 stars" style="color:#D8CFDD">★</button>
      </div>
    </fieldset>

    <div class="field"><label for="rvName"><span data-i18n="rv_name_l">আপনার নাম</span> <span class="req">*</span></label><input class="input" id="rvName" required maxlength="60" autocomplete="name"></div>
    <div class="field"><label for="rvText"><span data-i18n="rv_text_l">পণ্যটি কেমন লেগেছে?</span></label><textarea class="input" id="rvText" rows="4" maxlength="500" placeholder="আপনার মতামত লিখুন" data-i18n-ph="rv_text_ph"></textarea></div>
    <div class="field"><label for="rvPhoto"><span data-i18n="rv_photo_l">ছবি দিন</span> <span class="hint" style="display:inline" data-i18n="rv_photo_hint">(ঐচ্ছিক)</span></label><input id="rvPhoto" class="input" type="file" accept="image/*" style="padding:.6rem"></div>

    <button class="btn btn-primary btn-block" type="submit" id="reviewSubmitBtn" style="min-height:52px" data-i18n="rv_submit">রিভিউ সাবমিট করুন</button>
    <p class="field-error" id="reviewError"></p>
  </form>
  <div id="reviewSuccess" class="card card-pad" hidden style="margin-top:1rem;text-align:center;border-color:var(--success)">
    <svg width="56" height="56" viewBox="0 0 72 72" fill="none" aria-hidden="true" style="margin:0 auto .4rem"><circle cx="36" cy="36" r="33" stroke="#2E7D4F" stroke-width="4" opacity="0.35"/><path d="M23 37.5 33 47 52 27" stroke="#2E7D4F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2 style="font-family:var(--font-display);color:var(--purple)" data-i18n="rv_success_h">ধন্যবাদ!</h2>
    <p class="text-muted" data-i18n="rv_success_p">আপনার রিভিউ জমা হয়েছে। যাচাইয়ের পর এটি ওয়েবসাইটে প্রকাশ করা হবে।</p>
    <a class="btn btn-primary" style="margin-top:.8rem" href="index.html" data-i18n="rv_home">হোমে ফিরে যান</a>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const orderEl = document.getElementById('rvOrder');
if (params.get('o')) orderEl.value = params.get('o');
const phoneEl = document.getElementById('rvPhone');
phoneEl.addEventListener('input', () => { phoneEl.value = phoneEl.value.replace(/\D/g, '').slice(0, 11); });

let rating = 0;
const starBox = document.getElementById('starInput');
starBox.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  rating = +b.dataset.n;
  [...starBox.children].forEach(x => { const on = +x.dataset.n <= rating; x.style.color = on ? 'var(--gold)' : '#D8CFDD'; x.setAttribute('aria-checked', x === b); });
});

function shrink(file, max = 1000) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.82).split(',')[1]); };
    im.onerror = () => rej(new Error('ছবি পড়া যায়নি'));
    im.src = u;
  });
}

document.getElementById('reviewForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('reviewError');
  err.classList.remove('show');
  if (!rating) { err.textContent = MEHER.t('rv_invalid_rating'); err.classList.add('show'); return; }
  const ph = phoneEl.value.replace(/\D/g, '');
  if (!/^01[3-9]\d{8}$/.test(ph)) { err.textContent = MEHER.t('err_phone'); err.classList.add('show'); return; }
  const go = document.getElementById('reviewSubmitBtn');
  go.disabled = true; err.textContent = ''; err.classList.remove('show');
  try {
    const file = document.getElementById('rvPhoto').files[0];
    const photo = file ? await shrink(file) : '';
    const r = await MEHER_API.api({ action: 'review', review: { orderId: orderEl.value.trim(), phone: ph, rating, name: document.getElementById('rvName').value.trim(), text: document.getElementById('rvText').value.trim(), photo } });
    if (!r.ok) throw new Error(r.error || (MEHER.getLang() === 'en' ? 'Review failed to submit' : 'রিভিউ জমা হয়নি'));
    document.getElementById('reviewForm').hidden = true;
    document.getElementById('reviewSuccess').hidden = false;
    window.scrollTo(0, 0);
  } catch (ex) {
    go.disabled = false;
    err.textContent = ex.message || (MEHER.getLang() === 'en' ? 'Something went wrong — try again.' : 'সমস্যা হয়েছে, আবার চেষ্টা করুন।');
    err.classList.add('show');
  }
});
</script>
</body>
</html>
