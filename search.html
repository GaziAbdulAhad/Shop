<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — ARIFAH (আরিফাহ)</title>
<meta name="description" content="ARIFAH কালেকশন খুঁজুন — ব্রিডাল নেকলেস সেট ও কোমরের ভিতর।">
<meta name="robots" content="noindex"><meta name="theme-color" content="#352344">
<link rel="icon" type="image/svg+xml" href="assets/img/placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main"><span data-i18n="skip_to_content">Skip to content</span></a>
<div id="site-header"></div>

<main id="main" class="container" style="padding-bottom:var(--sp-7)">
  <div class="page-head" style="padding-bottom:var(--sp-3)">
    <span class="eyebrow" data-i18n="search_eyebrow">অনুসন্ধান</span>
    <h1 id="searchHeading" data-i18n="search_default_h1">কালেকশন খুঁজুন</h1>
    <form id="searchPageForm" role="search" style="display:flex;gap:.5rem;max-width:560px;margin-top:.8rem">
      <label class="sr-only" for="searchPageInput" data-i18n="search_btn_full">Search</label>
      <input class="input" id="searchPageInput" name="q" type="search" data-i18n-ph="search_ph" placeholder="প্রোডাক্ট খুঁজুন…" style="border-radius:var(--r-pill)">
      <button class="btn btn-primary" type="submit" data-i18n="search_btn_full">Search</button>
    </form>
  </div>

  <div id="searchHistory" style="margin:.5rem 0 1rem"></div>
  <p class="text-muted" id="resultCount" style="font-size:.85rem;margin-bottom:.75rem"></p>
  <div class="product-grid" id="productGrid"></div>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
'use strict';
const q = (new URLSearchParams(location.search).get('q') || '').trim();
const input = document.getElementById('searchPageInput');
input.value = q;

function renderHistory() {
  const wrap = document.getElementById('searchHistory');
  if (q) { wrap.innerHTML = ''; return; }
  let h = [];
  try { h = JSON.parse(localStorage.getItem('meher-search-history')) || []; } catch {}
  wrap.innerHTML = h.length
    ? `<p class="hint" style="margin-bottom:.35rem">${MEHER.t('search_recent')}:</p><div style="display:flex;gap:.4rem;flex-wrap:wrap">${h.map(s => `<a class="chip" href="search.html?q=${encodeURIComponent(s)}">${s.replace(/[<>&]/g, '')}</a>`).join('')}</div>`
    : '';
}

async function run() {
  await MEHER.loadProducts();
  const hits = q ? MEHER.searchProducts(q) : [];
  document.getElementById('searchHeading').innerHTML = q
    ? `${MEHER.t('results_for')} “<em style="color:var(--gold-deep)">${q.replace(/[<>&]/g, '')}</em>”`
    : MEHER.t('search_default_h1');
  document.getElementById('resultCount').textContent = q ? `${hits.length} ${MEHER.t('items')}` : '';
  MEHER.renderGrid(document.getElementById('productGrid'), hits);
  renderHistory();
}
document.getElementById('searchPageForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = input.value.trim();
  if (v) location.href = 'search.html?q=' + encodeURIComponent(v);
});
run();
window.addEventListener('meher:lang-changed', run);
</script>
</body>
</html>
