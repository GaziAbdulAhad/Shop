<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>অর্ডার করুন | আমার দোকান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap">
<h1>অর্ডার করুন</h1>
<div id="done" class="ok" hidden role="status"></div>
<div class="order-wrap" id="wrap"><p class="sub">লোড হচ্ছে...</p></div></main>
<script src="js/app.js"></script>
<script>
(async()=>{
  const wrap=document.getElementById("wrap");
  const id=new URLSearchParams(location.search).get("id");
  let p;
  try{p=(await getProducts()).find(x=>String(x.id)===String(id))}catch(e){}
  if(!p){wrap.innerHTML=`<div class="empty">প্রোডাক্টটি পাওয়া যায়নি। <a href="index.html">হোমে ফিরে যান</a></div>`;return}
  wrap.innerHTML=`<div class="card"><div id="gal"></div><div class="body">
    <h3>${esc(p.name)}</h3><div class="price">৳ ${esc(p.price)}</div><p class="full">${esc(p.desc||"")}</p></div></div>
  <form class="box" id="f" style="margin:0">
    <div class="two"><label>আপনার নাম<input name="name" required maxlength="80" autocomplete="name"></label>
    <label>মোবাইল নম্বর<input name="phone" type="tel" required placeholder="01XXXXXXXXX" autocomplete="tel"></label></div>
    <label>সম্পূর্ণ ঠিকানা<textarea name="address" rows="3" required maxlength="300" autocomplete="street-address"></textarea></label>
    <div class="two"><label>পরিমাণ<input name="qty" type="number" min="1" max="20" value="1" required></label>
    <label>মোট (ডেলিভারি চার্জ বাদে)<input id="total" readonly value="৳ ${Number(p.price)||0}"></label></div>
    <label>নোট (ঐচ্ছিক)<input name="note" maxlength="200"></label>
    <div class="row"><button class="btn gold" id="go" type="submit">অর্ডার কনফার্ম করুন</button><span class="msg" id="msg" role="status"></span></div>
  </form>`;
  initGallery(document.getElementById("gal"),p);
  const f=document.getElementById("f"),msg=document.getElementById("msg");
  f.qty.addEventListener("input",()=>document.getElementById("total").value="৳ "+((Number(p.price)||0)*(Number(f.qty.value)||1)));
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));
    d.phone=d.phone.replace(/[\s-]/g,"");
    if(!/^01[3-9]\d{8}$/.test(d.phone)){msg.style.color="#c0392b";msg.textContent="মোবাইল নম্বর ১১ ডিজিটের হতে হবে (01XXXXXXXXX)।";return}
    const go=document.getElementById("go");go.disabled=true;msg.style.color="";msg.textContent="অর্ডার পাঠানো হচ্ছে...";
    try{
      const r=await api({action:"order",order:{productId:p.id,...d}});
      if(!r.ok)throw new Error(r.error||"অর্ডার হয়নি");
      f.hidden=true;
      const dn=document.getElementById("done");dn.hidden=false;
      dn.innerHTML=`<strong>ধন্যবাদ! আপনার অর্ডার গ্রহণ করা হয়েছে।</strong><br>অর্ডার নম্বর: ${esc(r.orderId)}<br>আমরা শীঘ্রই ফোনে যোগাযোগ করব। <a href="index.html">আরও প্রোডাক্ট দেখুন</a>`;
      dn.scrollIntoView({behavior:"smooth"});
    }catch(err){go.disabled=false;msg.style.color="#c0392b";msg.textContent=err.message||"সমস্যা হয়েছে, আবার চেষ্টা করুন।"}
  });
})();
</script></body></html>
