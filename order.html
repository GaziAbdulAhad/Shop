<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#100B14">
<title>অর্ডার করুন | আমার দোকান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap co-wrap" id="co"><p class="sub" style="margin-top:28px">লোড হচ্ছে...</p></main>
<script src="js/app.js"></script><script src="js/shop.js"></script><script src="js/extras.js"></script>
<script>
(async()=>{
  const root=document.getElementById("co"),id=new URLSearchParams(location.search).get("id");
  let p;try{p=(await loadAll()).find(x=>String(x.id)===String(id))}catch(e){}
  if(!p){root.innerHTML='<div class="empty" style="margin-top:28px">প্রোডাক্টটি পাওয়া যায়নি। <a href="index.html">হোমে ফিরে যান</a></div>';return}
  if(isSoldOut(p)){root.innerHTML='<div class="empty" style="margin-top:28px">'+esc(p.name)+' — স্টক শেষ হয়ে গেছে। <a href="index.html">অন্য পণ্য দেখুন</a></div>';return}
  const c=cover(p);
  root.innerHTML=`<a class="back" href="product.html?id=${encodeURIComponent(p.id)}">← ফিরে যান</a><h1 style="font-size:1.7rem">অর্ডার সম্পন্ন করুন</h1>
  <form class="box" id="f">
   <div class="sum-p">${c?`<img src="${esc(c)}" alt="" referrerpolicy="no-referrer" onerror="imgFail(this)">`:""}<div><b>${esc(p.name)}</b>${priceHTML(p)}</div>
   <select name="qty" aria-label="পরিমাণ">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select></div>
   <h2>আপনার তথ্য</h2>
   <label>নাম<input name="name" required maxlength="80" autocomplete="name" placeholder="আপনার নাম"></label>
   <label>মোবাইল নম্বর<input name="phone" type="tel" inputmode="numeric" required placeholder="01XXXXXXXXX" autocomplete="tel"></label>
   <label>জেলা<select name="district" required><option value="">জেলা নির্বাচন করুন</option>${DISTRICTS.map(d=>`<option>${d}</option>`).join("")}</select></label>
   <label>সম্পূর্ণ ঠিকানা<textarea name="address" rows="3" required maxlength="300" placeholder="আপনার ডেলিভারি ঠিকানা" autocomplete="street-address"></textarea></label>
   <fieldset class="dv"><legend>ডেলিভারি</legend>${Object.entries(DELIVERY).map(([k,v])=>`<label class="rd"><input type="radio" name="delivery" value="${k}" ${k==="out"?"checked":""}><span>${v.label}</span><b>${tk(v.fee)}</b></label>`).join("")}</fieldset>
   <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
   <div class="tot" id="tot"></div>
   <button class="btn gold big" id="go" type="submit">🛒 অর্ডার কনফার্ম করুন</button><p class="msg" id="msg" role="status"></p>
  </form>`;
  const f=document.getElementById("f"),msg=document.getElementById("msg");
  const calc=()=>{const fee=DELIVERY[f.delivery.value].fee,sub=Number(p.price)*Number(f.qty.value);
    document.getElementById("tot").innerHTML=`<div><span>প্রোডাক্ট</span><b>${tk(sub)}</b></div><div><span>ডেলিভারি</span><b>${tk(fee)}</b></div><div class="g"><span>মোট</span><b>${tk(sub+fee)}</b></div>`};
  f.district.addEventListener("change",()=>{if(f.district.value){f.delivery.value=f.district.value==="ঢাকা"?"in":"out"}calc()});
  f.addEventListener("input",calc);f.addEventListener("change",calc);calc();
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));d.phone=d.phone.replace(/[\s-]/g,"");
    if(!/^01[3-9]\d{8}$/.test(d.phone)){msg.style.color="#ff7b6b";msg.textContent="মোবাইল নম্বর ১১ ডিজিটের হতে হবে (01XXXXXXXXX)।";return}
    const go=document.getElementById("go");go.disabled=true;msg.style.color="";msg.textContent="অর্ডার পাঠানো হচ্ছে...";
    try{
      const r=await api({action:"order",order:{productId:p.id,...d}});
      if(!r.ok)throw new Error(r.error||"অর্ডার হয়নি");
      root.innerHTML=`<div class="ok"><div class="tick">✓</div><h1 style="font-size:1.6rem">অর্ডার সফল হয়েছে!</h1><p>ধন্যবাদ আপনার অর্ডারের জন্য ❤️</p>
      <p>অর্ডার নম্বর: <b>${esc(r.orderId)}</b></p><p>${esc(p.name)}<br>মোট: <b>${tk(r.total)}</b></p>
      <p style="color:var(--muted)">আপনার অর্ডারটি আমরা পেয়েছি। আমাদের প্রতিনিধি আপনার দেওয়া মোবাইল নম্বরে যোগাযোগ করবেন।</p>
      <p><a class="btn alt2" href="track.html?o=${encodeURIComponent(r.orderId)}">অর্ডার ট্র্যাক করুন</a></p>
      <a class="btn gold" href="index.html">🏠 হোমে ফিরে যান</a></div>`;
      window.scrollTo(0,0);
    }catch(err){go.disabled=false;msg.style.color="#ff7b6b";msg.textContent=err.message||"সমস্যা হয়েছে, আবার চেষ্টা করুন।"}
  });
})();
</script></body></html>
