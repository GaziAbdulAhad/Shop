<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#100B14">
<title>নীতিমালা | আমার দোকান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap" style="max-width:820px">
<div class="pbar" style="margin:24px 0 16px"><div class="chips" id="ptabs" style="margin:0"></div>
<div class="lang" id="lang"><button data-l="0">বাংলা</button><button data-l="1">English</button></div></div>
<div id="pbody"></div></main>
<script src="js/app.js"></script><script src="js/policies.js"></script><script src="js/shop.js"></script>
<script>
const $=id=>document.getElementById(id);
function cur(){const h=location.hash.slice(1);return POLICIES.find(p=>p.id===h)||POLICIES[0]}
function draw(){
  const i=L(),p=cur();
  $("ptabs").innerHTML=POLICIES.map(x=>`<button class="chip${x.id===p.id?" on":""}" data-id="${x.id}">${x.icon} ${x.t[i]}</button>`).join("");
  $("lang").querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.l===i));
  $("pbody").innerHTML=`<h1 style="font-size:1.8rem">${p.icon} ${p.t[i]}</h1>`+p.s.map(s=>`<section class="ps">${s.h[i]?`<h2>${T(s.h[i])}</h2>`:""}${blk(s.b[i])}</section>`).join("")
   +`<p class="hint"><a href="contact.html">${i?"Contact us":"যোগাযোগ করুন"}</a></p>`;
  document.title=p.t[i]+" | "+SHOP_NAME;
}
$("ptabs").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b){location.hash=b.dataset.id}});
$("lang").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;try{localStorage.setItem("lang",b.dataset.l==="1"?"en":"bn")}catch(x){}draw()});
window.addEventListener("hashchange",()=>{draw();window.scrollTo(0,0)});
draw();
</script></body></html>
