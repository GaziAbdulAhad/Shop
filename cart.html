<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#100B14">
<title>কার্ট | আমার দোকান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap co-wrap" id="ct"><p class="sub" style="margin-top:28px">লোড হচ্ছে...</p></main>
<script src="js/app.js"></script><script src="js/shop.js"></script><script src="js/extras.js"></script>
<script>
(async()=>{
  const root=document.getElementById("ct");
  let all=[];try{all=await loadAll()}catch(e){}
  let notes=[];
  if(all.length){let l=cartGet();l=l.filter(x=>{const p=all.find(y=>String(y.id)===String(x.id));
    if(!p){notes.push(x.name+" — পাওয়া যায়নি");return false}
    if(isSoldOut(p)){notes.push(x.name+" — স্টক শেষ");return false}
    x.price=Number(p.price)||0;x.name=p.name;x.img=cover(p)||x.img;return true});cartSet(l)}
  const empty=()=>{root.innerHTML=`<h1 style="font-size:1.7rem;margin-top:28px">আপনার কার্ট</h1><div class="empty">কার্ট খালি আছে। <a href="index.html">পণ্য দেখুন</a></div>`};
  if(!cartGet().length){empty();return}
  root.innerHTML=`<a class="back" href="index.html">← আরও পণ্য দেখুন</a><h1 style="font-size:1.7rem">আপনার কার্ট</h1>
  ${notes.length?`<div class="demo">${notes.map(esc).join("<br>")}<br>এই পণ্যগুলো কার্ট থেকে সরানো হয়েছে।</div>`:""}
  <div id="items"></div>
  <form class="box" id="f">
   <h2 style="font-size:1.2rem;margin:4px 0">আপনার তথ্য</h2>
   <label>নাম<input name="name" required maxlength="80" autocomplete="name" placeholder="আপনার নাম"></label>
   <label>মোবাইল নম্বর<input name="phone" type="tel" inputmode="numeric" required placeholder="01XXXXXXXXX" autocomplete="tel"></label>
   <label>জেলা<select name="district" required><option value="">জেলা নির্বাচন করুন</option>${DISTRICTS.map(d=>`<option>${d}</option>`).join("")}</select></label>
   <label>সম্পূর্ণ ঠিকানা<textarea name="address" rows="3" required maxlength="300" placeholder="আপনার ডেলিভারি ঠিকানা" autocomplete="street-address"></textarea></label>
   <fieldset class="dv"><legend>ডেলিভারি</legend>${Object.entries(DELIVERY).map(([k,v])=>`<label class="rd"><input type="radio" name="delivery" value="${k}" ${k==="out"?"checked":""}><span>${v.label}</span><b>${tk(v.fee)}</b></label>`).join("")}</fieldset>
   <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
   <div class="tot" id="tot"></div>
   <button class="btn gold big" id="go" type="submit">🛒 অর্ডার কনফার্ম করুন</button><p class="msg" id="msg" role="status"></p>
  </form>`;
  const f=document.getElementById("f"),msg=document.getElementById("msg"),box=document.getElementById("items");
  const draw=()=>{const l=cartGet();if(!l.length){empty();return}
    box.innerHTML=l.map(x=>`<div class="ci">${x.img?`<img src="${esc(x.img)}" alt="" referrerpolicy="no-referrer" onerror="imgFail(this)">`:""}<div class="nm"><b>${esc(x.name)}</b><span>${tk(x.price)}</span></div>
      <div class="qty"><button type="button" data-q="-1" data-id="${esc(x.id)}" aria-label="কমান">−</button><b>${x.qty}</b><button type="button" data-q="1" data-id="${esc(x.id)}" aria-label="বাড়ান">+</button></div>
      <button class="rm" type="button" data-rm="${esc(x.id)}" aria-label="সরান">✕</button></div>`).join("");calc()};
  const calc=()=>{const sub=cartSum(),fee=DELIVERY[f.delivery.value].fee;
    document.getElementById("tot").innerHTML=`<div><span>পণ্য (${cartCount()} টি)</span><b>${tk(sub)}</b></div><div><span>ডেলিভারি</span><b>${tk(fee)}</b></div><div class="g"><span>মোট</span><b>${tk(sub+fee)}</b></div>`};
  box.addEventListener("click",e=>{const q=e.target.closest("[data-q]"),r=e.target.closest("[data-rm]");let l=cartGet();
    if(q){const i=l.findIndex(x=>String(x.id)===q.dataset.id);if(i>=0){l[i].qty=Math.max(1,Math.min(20,l[i].qty+Number(q.dataset.q)));cartSet(l)}}
    if(r){l=l.filter(x=>String(x.id)!==r.dataset.rm);cartSet(l)}
    draw()});
  f.district.addEventListener("change",()=>{if(f.district.value)f.delivery.value=f.district.value==="ঢাকা"?"in":"out";calc()});
  f.addEventListener("change",calc);draw();
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));d.phone=d.phone.replace(/[\s-]/g,"");
    if(!/^01[3-9]\d{8}$/.test(d.phone)){msg.style.color="#ff7b6b";msg.textContent="মোবাইল নম্বর ১১ ডিজিটের হতে হবে (01XXXXXXXXX)।";return}
    const go=document.getElementById("go");go.disabled=true;msg.style.color="";msg.textContent="অর্ডার পাঠানো হচ্ছে...";
    try{
      const r=await api({action:"order",order:{items:cartGet().map(x=>({productId:x.id,qty:x.qty})),...d}});
      if(!r.ok)throw new Error(r.error||"অর্ডার হয়নি");
      cartSet([]);
      root.innerHTML=`<div class="ok"><div class="tick">✓</div><h1 style="font-size:1.6rem">অর্ডার সফল হয়েছে!</h1><p>ধন্যবাদ আপনার অর্ডারের জন্য ❤️</p>
      <p>অর্ডার নম্বর: <b>${esc(r.orderId)}</b></p><p>মোট: <b>${tk(r.total)}</b></p>
      <p style="color:var(--muted)">আপনার অর্ডারটি আমরা পেয়েছি। আমাদের প্রতিনিধি আপনার দেওয়া মোবাইল নম্বরে যোগাযোগ করবেন।</p>
      <p><a class="btn alt2" href="track.html?o=${encodeURIComponent(r.orderId)}">অর্ডার ট্র্যাক করুন</a></p><a class="btn gold" href="index.html">🏠 হোমে ফিরে যান</a></div>`;
      window.scrollTo(0,0);
    }catch(err){go.disabled=false;msg.style.color="#ff7b6b";msg.textContent=err.message||"সমস্যা হয়েছে, আবার চেষ্টা করুন।"}
  });
})();
</script></body></html>
