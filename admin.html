<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রোডাক্ট যোগ করুন | আমার দোকান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap">
<h1>নতুন প্রোডাক্ট যোগ করুন</h1><p class="sub">YouTube লিংক দিলে প্রোডাক্টে ভিডিও চালু হবে।</p>
<div class="box" style="padding:0;border:0;background:none">
<form class="box" id="f">
<label>অ্যাডমিন পাসওয়ার্ড<input name="password" type="password" required></label>
<label>প্রোডাক্টের নাম<input name="name" required></label>
<label>দাম (৳)<input name="price" type="number" min="0" required></label>
<label>বিবরণ<textarea name="desc" rows="3"></textarea></label>
<label>YouTube ভিডিও লিংক<input name="video" type="url" placeholder="https://www.youtube.com/watch?v=..."></label>
<label>ছবির লিংক (Google Drive-এ "Anyone with the link" করে দিন)<input name="image" type="url"></label>
<div class="row"><button class="btn" type="submit">প্রোডাক্ট সেভ করুন</button><span class="msg" id="msg" role="status"></span></div>
</form></div>
<h2>সব প্রোডাক্ট</h2><section class="grid" id="list"></section></main>
<script src="js/app.js"></script>
<script>
const list=document.getElementById("list"),msg=document.getElementById("msg"),f=document.getElementById("f");
renderList(list,true);
function say(t,bad){msg.style.color=bad?"#c0392b":"";msg.textContent=t}
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const {password,...p}=Object.fromEntries(new FormData(f));
  if(p.video&&!ytId(p.video))return say("YouTube লিংকটি সঠিক নয়, আবার দেখুন।",1);
  say("সেভ হচ্ছে...");
  try{
    const r=await api({action:"add",password,product:{id:Date.now(),...p}});
    if(!r.ok)return say(r.error||"সেভ হয়নি",1);
    sessionStorage.setItem("pw",password);
    f.reset();say("সেভ হয়েছে।");renderList(list,true);
  }catch(err){say("সার্ভারে যোগাযোগ করা যায়নি।",1)}
});
list.addEventListener("click",async e=>{
  const id=e.target.dataset.del;if(!id||!confirm("এই প্রোডাক্ট মুছে ফেলবেন?"))return;
  const password=f.password.value||sessionStorage.getItem("pw")||prompt("অ্যাডমিন পাসওয়ার্ড দিন");
  if(!password)return;
  const r=await api({action:"delete",password,id});
  if(!r.ok)return say(r.error||"মোছা যায়নি",1);
  renderList(list,true);
});
</script></body></html>
