<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — ARIFAH (আরিফাহ)</title>
<meta name="description" content="Your saved ARIFAH styles — move them to your bag whenever you're ready.">
<meta name="robots" content="noindex"><meta name="theme-color" content="#352344">
<link rel="icon" type="image/svg+xml" href="assets/img/placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main"><span data-i18n="skip_to_content">Skip to content</span></a>
<div id="site-header"></div>

<main id="main" class="container" style="padding-bottom:var(--sp-7)">
  <div class="page-head" style="padding-bottom:var(--sp-4)">
    <span class="eyebrow" data-i18n="wish_eyebrow">পরে দেখবেন বলে সেভ</span>
    <h1><span data-i18n="wish_h1">আপনার উইশলিস্ট</span> <span id="wishTotal" class="text-muted" style="font-size:var(--fs-lg)"></span></h1>
    <p class="text-muted" data-i18n="wish_sub">প্রতিটা পণ্যের ♡ চাপলে এখানে সেভ থাকবে — এই ডিভাইসে।</p>
  </div>

  <div class="empty-state card" id="wishlistEmpty" hidden>
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--dusty-pink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 8.6a5.5 5.5 0 0 0-9.3-5.4L12 2l-.5 1.2A5.5 5.5 0 0 0 3.2 8.6c0 5.4 7 9.6 8.8 10.6 1.8-1 8.8-5.2 8.8-10.6Z"/></svg>
    <h2 data-i18n="wish_empty_h">আপনার উইশলিস্ট খালি</h2>
    <p class="text-muted" data-i18n="wish_empty_p">পছন্দের পণ্য সেভ করে রাখুন — পরে এখানেই পাবেন।</p>
    <a class="btn btn-primary" style="margin-top:1.2rem" href="shop.html" data-i18n="wish_browse">প্রোডাক্ট দেখুন</a>
  </div>
  <div class="product-grid" id="wishlistGrid" style="grid-template-columns:repeat(4,1fr)"></div>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
'use strict';
async function renderWishlist() {
  const U = window.MEHER_UTIL;
  await MEHER.loadProducts();
  const ids = MEHER.getWishlist();
  const grid = document.getElementById('wishlistGrid');
  document.getElementById('wishTotal').textContent = ids.length ? `(${ids.length})` : '';
  const empty = document.getElementById('wishlistEmpty');
  if (!ids.length) { grid.innerHTML = ''; grid.style.display = 'none'; empty.hidden = false; return; }
  grid.style.display = ''; empty.hidden = true;
  MEHER.renderGrid(grid, ids.map(U.findProduct).filter(Boolean));
}
renderWishlist();
window.addEventListener('meher:lang-changed', renderWishlist);
</script>
</body>
</html>
